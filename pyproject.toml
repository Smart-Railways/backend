[project]
name = "backend"
version = "0.1.0"
description = "Railway Maintenance and Block Window Backend API"
readme = "README.md"
authors = [
    { name = "Aryan", email = "asguy29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1",
    "django-cors-headers>=4.4.0",
    "djangorestframework>=3.18.0",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.5",
    "python-dotenv>=1.2.3",
    "redis>=8.1.0",
    "whitenoise>=6.7.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
