services:
  redis:
    image: redis:7-alpine
    container_name: railway-redis
    ports:
      - "6379:6379"
    restart: always

  ai-engine:
    build:
      context: ../../railway-ai-main/railway-ai-main
      dockerfile: Dockerfile
    container_name: railway-ai-service
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: always

  web:
    build: .
    container_name: railway-backend-web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai-engine:8001
    depends_on:
      - redis
      - ai-engine

  celery:
    build: .
    container_name: railway-celery-worker
    command: celery -A config worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - AI_SERVICE_URL=http://ai-engine:8001
    depends_on:
      - redis
      - ai-engine